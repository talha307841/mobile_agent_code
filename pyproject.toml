[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentdeck"
version = "0.1.0"
description = "Secure remote control plane for local coding agents"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "pyjwt[crypto]>=2.9,<3",
  "argon2-cffi>=23.1,<24",
  "python-multipart>=0.0.9,<1",
  "email-validator>=2.2,<3",
  "websockets>=13,<16",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "platformdirs>=4.3,<5",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
agentdeck = "agentdeck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["server/app", "client/agentdeck", "shared/agentdeck_protocol"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests", "client/tests"]
pythonpath = [".", "client", "shared"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
